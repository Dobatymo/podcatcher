[build-system]
build-backend = "flit_core.buildapi"
requires = [
  "flit-core<4,>=3.2",
]

[project]
name = "podcatcher"
readme = "readme.md"
authors = [ { name = "Dobatymo" } ]
requires-python = ">=3.8"
classifiers = [
  "License :: OSI Approved :: ISC License (ISCL)",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [
  "description",
  "version",
]
dependencies = [
  "feedgen>=1",
  "feedparser>=6.0.11",
  "flask>=3.0.3",
  "genutility[flask,http,json,rich]>=0.0.106",
  "pafy>=0.5.5",
  "platformdirs>=4.2.2",
  "werkzeug>=3.0.3",
  "wtforms>=3.1.2",
  "youtube-dl>=2021.12.17",
]
urls.Source = "https://github.com/Dobatymo/podcatcher"
scripts.podcatcher-cli = "podcatcher.cli:main"
scripts.podcatcher-web = "podcatcher.web:main"

[tool.ruff]
line-length = 120
lint.extend-select = [ "B", "I", "S", "UP" ]
lint.ignore = [ "B011", "S101" ]
lint.pyupgrade.keep-runtime-typing = true

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
warn_unused_configs = true
no_implicit_optional = true
